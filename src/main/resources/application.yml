spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding : UTF-8
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:postgresql://localhost:5432/log_service_db
    username: demo_user
    password: demo_pass
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: central-logger
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: 8081
  servlet:
    context-path: /
